[workspace]
resolver = "2"
members = [
    "crates/lightbeam-protocol",
    "crates/lightbeam-fec",
    "crates/lightbeam-crypto",
    "crates/lightbeam-qr",
    "crates/lightbeam-core",
    "tools/test-vector-generator",
]
default-members = [
    "crates/lightbeam-protocol",
    "crates/lightbeam-fec",
    "crates/lightbeam-crypto",
    "crates/lightbeam-qr",
    "crates/lightbeam-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Goldmann LLC"]
repository = "https://github.com/goldmann/lightbeam"

[workspace.dependencies]
lightbeam-protocol = { path = "crates/lightbeam-protocol" }
lightbeam-fec = { path = "crates/lightbeam-fec" }
lightbeam-crypto = { path = "crates/lightbeam-crypto" }
lightbeam-qr = { path = "crates/lightbeam-qr" }
lightbeam-core = { path = "crates/lightbeam-core" }
sha2 = "0.10"
crc32fast = "1.4"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_cbor = "0.11"
rand = "0.8"
rand_chacha = "0.3"
ed25519-dalek = { version = "2", features = ["rand_core"] }
chacha20poly1305 = "0.10"
argon2 = "0.5"
hex = "0.4"
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
web-sys = "0.3"
zstd = "0.13"
flate2 = "1"
base64 = "0.22"
uniffi = "0.28"
