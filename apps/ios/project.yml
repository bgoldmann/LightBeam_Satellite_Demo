name: LightBeam
options:
  bundleIdPrefix: com.goldmannllc
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en
  knownRegions:
    - en
    - fa

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  zstd:
    url: https://github.com/facebook/zstd
    from: 1.5.6
  zxing-cpp:
    url: https://github.com/zxing-cpp/zxing-cpp
    from: 2.3.0

targets:
  LightBeam:
    type: application
    platform: iOS
    sources:
      - path: LightBeam
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goldmannllc.LightBeam
        INFOPLIST_FILE: LightBeam/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9SA68Z35FA
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        OTHER_LDFLAGS: "$(inherited) -lz"
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        CLANG_CXX_LIBRARY: libc++
    dependencies:
      - package: zstd
        product: libzstd
      - package: zxing-cpp
        product: ZXingCpp

  LightBeamTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LightBeamTests
    dependencies:
      - target: LightBeam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goldmannllc.LightBeam.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  LightBeam:
    build:
      targets:
        LightBeam: all
        LightBeamTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LightBeamTests
