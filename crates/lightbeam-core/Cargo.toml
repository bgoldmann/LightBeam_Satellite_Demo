[package]
name = "lightbeam-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightBeam shared facade: encode/decode sessions for WASM and native"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["native"]
native = []
wasm = ["wasm-bindgen", "js-sys", "serde-wasm-bindgen", "console_error_panic_hook", "getrandom"]

[dependencies]
lightbeam-protocol = { workspace = true }
lightbeam-fec = { workspace = true }
lightbeam-crypto = { workspace = true }
lightbeam-qr = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_cbor = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
flate2 = { workspace = true }
base64 = { workspace = true }

wasm-bindgen = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
serde-wasm-bindgen = { workspace = true, optional = true }
console_error_panic_hook = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }

[dev-dependencies]
hex = { workspace = true }
rand = { workspace = true }
